[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovf"
version = "1.0.0"
description = "Oulu2026 Visitor Flow Framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
ingest = [
  "pandas>=2.2",
  "requests>=2.32",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "pyarrow>=16.0",
]
forecast = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=16.0",
]
prophet = [
  "prophet>=1.1",
  "xgboost>=2.0",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-requests>=2.32",
]

[tool.setuptools]
package-dir = { ovf_ingest = "packages/ingest/src/ovf_ingest", ovf_forecast = "packages/forecast/src/ovf_forecast" }
packages = ["ovf_ingest", "ovf_ingest.clients", "ovf_forecast", "ovf_forecast.models"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/ingest/src", "packages/ingest/tests", "packages/forecast/src", "packages/forecast/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"packages/ingest/tests/*" = ["S101"]
"packages/forecast/tests/*" = ["S101"]
# The evaluation package writes its report in Finnish and uses the typography Finnish
# asks for: an en dash for ranges and a non-breaking space between thousands. Both are
# what the rendered text should contain, so the ambiguous-character rule is off there.
"packages/forecast/src/ovf_forecast/evaluation/*" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["packages/ingest/src", "packages/ingest/tests", "packages/forecast/src", "packages/forecast/tests"]
# Both test packages have a conftest.py, which mypy cannot tell apart by module name.
# The fixtures they hold are excluded; every other test module is still checked, and the
# shared helpers live in the uniquely named support.py / synthetic.py next to them.
exclude = "(^|/)conftest\\.py$"
mypy_path = "packages/ingest/src:packages/forecast/src:packages/ingest/tests:packages/forecast/tests"
strict = true
plugins = []
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "sklearn.*", "prophet.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/ingest/tests", "packages/forecast/tests"]
pythonpath = ["packages/ingest/src", "packages/forecast/src"]
addopts = "-q"
